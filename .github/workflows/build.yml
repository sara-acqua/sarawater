# This workflow runs tests and builds documentation for the project on each push and pull request.

name: build

on:
  push:
    branches:
      - '**'
    tags-ignore:
      - '**'
  pull_request:


jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - uses: dorny/paths-filter@v4.0.3
        id: filter
        with:
          filters: |
            docs:
              - 'docs/**'
              - 'tutorials/**'

  format:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}
      
      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.11'
      
      - name: Install black
        run: pip install "black[jupyter]"
      
      - name: Check code formatting (PR from fork)
        if: github.event.pull_request.head.repo.fork == true
        run: |
          black --check .
          if [ $? -ne 0 ]; then
            echo "❌ Code is not formatted with black. Please run 'black .' locally and push changes."
            exit 1
          fi
      
      - name: Run black formatter and commit (own repo)
        if: github.event.pull_request.head.repo.fork == false || github.event_name == 'push'
        run: |
          black .
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -A
          git diff --staged --quiet || git commit -m "style: auto-format code with black"
          git push

  test:
    needs: format
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    
    steps:
    - uses: actions/checkout@v7.0.1
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7.0.0
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"
    
    - name: Run tests
      run: |
        python -m pytest tests/ -v

  docs-validate:
    needs: [format, changes]
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v7.0.1
      with:
        persist-credentials: false
    
    - name: Set up Python
      uses: actions/setup-python@v7.0.0
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[docs]"
    
    - name: Build HTML
      run: |
        cd docs && make html
    
    - name: Upload artifacts
      uses: actions/upload-artifact@v7.0.1
      with:
        name: html-docs
        path: docs/build/html/

  docs-deploy:
    needs: docs-validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.docs-validate.result == 'success'
    environment:
      name: github-pages
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    steps:
    - name: Download artifacts
      uses: actions/download-artifact@v8.0.1
      with:
        name: html-docs
        path: docs/build/html/

    - name: Setup Pages
      uses: actions/configure-pages@v6.0.0

    - name: Upload Pages artifact
      uses: actions/upload-pages-artifact@v5.0.0
      with:
        path: docs/build/html

    - name: Deploy to GitHub Pages
      uses: actions/deploy-pages@v5.0.0